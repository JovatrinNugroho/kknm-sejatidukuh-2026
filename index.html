<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KKN-M UNY 2026 | Sejati Dukuh</title>
    
    <!-- Load Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Load FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* =========================================
           COLOR PALETTE DARI DESIGN GUIDELINE 2026
           ========================================= */
        :root {
            --yellow-earth: #F0C52B;
            --cloud-white: #FAFAFA;
            --nano-black: #141414;
            --cafe-noir: #4C3D19;
            --kombu-green: #374026;
            --tan: #CFBB9B;
            --bone: #E6D8C3;
        }

        body {
            background-color: var(--kombu-green);
            color: var(--cloud-white);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            /* Latar belakang bertekstur halus dari perpaduan warna */
            background-image: radial-gradient(circle at top right, #4a5535 0%, var(--kombu-green) 60%);
        }

        /* =========================================
           ANIMASI & INTERAKTIVITAS
           ========================================= */
        @keyframes fadeInSlideUp {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(240, 197, 43, 0.5); }
            70% { box-shadow: 0 0 0 15px rgba(240, 197, 43, 0); }
            100% { box-shadow: 0 0 0 0 rgba(240, 197, 43, 0); }
        }

        .animate-item {
            opacity: 0;
            animation: fadeInSlideUp 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        /* Delay stagger untuk setiap elemen */
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }

        .profile-img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid var(--yellow-earth);
            background-color: var(--cloud-white); /* Backing jika pakai logo PNG transparan */
            animation: fadeInSlideUp 0.8s ease forwards, pulseGlow 3s infinite;
        }

        /* =========================================
           DESAIN TOMBOL (LINKTREE STYLE)
           ========================================= */
        .link-btn {
            background-color: var(--bone);
            color: var(--nano-black);
            border: 2px solid var(--tan);
            border-radius: 50px;
            position: relative;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-weight: 700;
            overflow: hidden;
            z-index: 1;
        }

        /* Efek interaktif saat hover */
        .link-btn:hover {
            background-color: var(--yellow-earth);
            color: var(--nano-black);
            transform: translateY(-5px) scale(1.02);
            border-color: var(--yellow-earth);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3), 0 0 15px rgba(240, 197, 43, 0.4);
        }
        
        .link-btn:active {
            transform: scale(0.95);
        }

        /* Animasi Ikon di dalam tombol */
        .icon-wrapper {
            font-size: 1.3rem;
            transition: transform 0.4s ease;
        }
        
        .link-btn:hover .icon-wrapper {
            transform: rotate(-15deg) scale(1.2);
            color: var(--cafe-noir) !important;
        }

        /* =========================================
           SPA LOGIC (Sembunyikan halaman tidak aktif)
           ========================================= */
        .page-section {
            display: none;
            width: 100%;
        }
        .page-section.active {
            display: block;
        }

        /* Tombol Kembali */
        .btn-back {
            background: transparent;
            color: var(--yellow-earth);
            border: none;
            font-size: 1.2rem;
            transition: all 0.3s;
        }
        .btn-back:hover {
            color: var(--cloud-white);
            transform: translateX(-5px);
        }

        /* Kartu Profil Anggota */
        .member-card {
            background-color: var(--cafe-noir);
            border: 2px solid var(--tan);
            border-radius: 20px;
            padding: 30px 20px;
            color: var(--cloud-white);
        }
    </style>
</head>
<body>
    <div class="container py-5 d-flex flex-column align-items-center" style="max-width: 500px; min-height: 100vh;">
        
        <!-- =========================================
             HALAMAN 1: BERANDA (LINKS)
             ========================================= -->
        <div id="page-home" class="page-section active text-center w-100">
            <img src="logo-kkn.png" alt="Logo KKN" class="profile-img mb-3">
            
            <div class="animate-item delay-1">
                <h2 class="fw-bold mb-0" style="color: var(--yellow-earth);">KKN-M UNY 2026</h2>
                <p class="mb-4" style="color: var(--tan); font-weight: 500; letter-spacing: 1px;">SEJATI DUKUH, MOYUDAN</p>
            </div>

            <div class="d-flex flex-column gap-3 w-100">
                <!-- Tombol ke Halaman Anggota -->
                <button onclick="navigasiKe('page-team')" class="btn link-btn py-3 animate-item delay-2">
                    <i class="fa-solid fa-users icon-wrapper text-secondary"></i>
                    Kenalan Sama Anggota Kami
                </button>

                <!-- Link Sosmed -->
                <a href="https://instagram.com/" target="_blank" class="btn link-btn py-3 animate-item delay-3">
                    <i class="fa-brands fa-instagram icon-wrapper" style="color: #E1306C;"></i>
                    Instagram KKN
                </a>

                <a href="https://wa.me/6281234567890" target="_blank" class="btn link-btn py-3 animate-item delay-4">
                    <i class="fa-brands fa-whatsapp icon-wrapper" style="color: #25D366;"></i>
                    Hubungi Kami (WA)
                </a>
            </div>
            
            <div class="animate-item mt-5" style="animation-delay: 0.6s;">
                <small style="color: var(--tan);">© 2026 KKN Mandiri UNY • Design Guideline</small>
            </div>
        </div>

        <!-- =========================================
             HALAMAN 2: DAFTAR ANGGOTA
             ========================================= -->
        <div id="page-team" class="page-section text-center w-100">
            <div class="d-flex align-items-center mb-4 animate-item">
                <button onclick="navigasiKe('page-home')" class="btn-back"><i class="fa-solid fa-arrow-left"></i></button>
                <h3 class="fw-bold mx-auto mb-0" style="color: var(--yellow-earth); transform: translateX(-15px);">Tim Kami</h3>
            </div>
            
            <p style="color: var(--cloud-white);" class="mb-4 animate-item delay-1">Pilih divisi untuk melihat profil lengkap anggota KKN Sejati Dukuh.</p>

            <div class="d-flex flex-column gap-3 w-100">
                <!-- List Anggota, data dikirim melalui fungsi JavaScript -->
                <button onclick="lihatProfil('Ahmad', 'Ketua KKN', 'Visi: Mengabdi dengan sepenuh hati untuk Sejati Dukuh yang lebih maju.', 'fa-user-tie')" class="btn link-btn py-3 animate-item delay-1">
                    <i class="fa-solid fa-user-tie icon-wrapper" style="color: var(--kombu-green)"></i> KETUA KKN
                </button>

                <button onclick="lihatProfil('Siti', 'Wakil Ketua', 'Mendukung program kerja berjalan lancar dan menjaga kekompakan tim.', 'fa-user-graduate')" class="btn link-btn py-3 animate-item delay-2">
                    <i class="fa-solid fa-user-graduate icon-wrapper" style="color: var(--kombu-green)"></i> WAKIL KETUA
                </button>

                <button onclick="lihatProfil('Budi', 'Koor. PDD', 'Dokumentasi adalah kunci keabadian sebuah momen.', 'fa-camera-retro')" class="btn link-btn py-3 animate-item delay-3">
                    <i class="fa-solid fa-camera-retro icon-wrapper" style="color: var(--kombu-green)"></i> PUBLIKASI & DOKUMENTASI
                </button>
                
                <button onclick="lihatProfil('Ayu', 'Sekretaris', 'Mencatat hari ini untuk dievaluasi esok hari.', 'fa-book-open')" class="btn link-btn py-3 animate-item delay-4">
                    <i class="fa-solid fa-book-open icon-wrapper" style="color: var(--kombu-green)"></i> SEKRETARIS
                </button>
            </div>
        </div>

        <!-- =========================================
             HALAMAN 3: DETAIL PROFIL ANGGOTA
             ========================================= -->
        <div id="page-profile" class="page-section text-center w-100">
            <div class="d-flex align-items-center mb-4 animate-item">
                <button onclick="navigasiKe('page-team')" class="btn-back"><i class="fa-solid fa-arrow-left"></i></button>
                <h3 class="fw-bold mx-auto mb-0" style="color: var(--cloud-white); transform: translateX(-15px);">Profil</h3>
            </div>

            <div class="member-card animate-item delay-1">
                <!-- Ikon pengganti foto profil -->
                <div class="mx-auto mb-3 d-flex align-items-center justify-content-center" style="width: 100px; height: 100px; background-color: var(--bone); border-radius: 50%; border: 4px solid var(--yellow-earth);">
                    <i id="profil-ikon" class="fa-solid fa-user fs-1" style="color: var(--kombu-green);"></i>
                </div>
                
                <h2 id="profil-nama" class="fw-bold mb-1" style="color: var(--yellow-earth);">Nama Anggota</h2>
                <h5 id="profil-jabatan" style="color: var(--tan);" class="mb-4">Jabatan</h5>
                
                <div style="background-color: rgba(250, 250, 250, 0.05); padding: 15px; border-radius: 10px; border: 1px dashed var(--tan);">
                    <i class="fa-solid fa-quote-left mb-2" style="color: var(--yellow-earth); opacity: 0.5;"></i>
                    <p id="profil-bio" class="fst-italic mb-0 text-light">"Bio singkat atau pesan dari anggota KKN."</p>
                </div>
            </div>
        </div>

    </div>

    <!-- =========================================
         SCRIPT UNTUK INTERAKSI SPA
         ========================================= -->
    <script>
        // Fungsi untuk pindah halaman
        function navigasiKe(idHalaman) {
            // Sembunyikan semua halaman
            document.querySelectorAll('.page-section').forEach(page => {
                page.classList.remove('active');
            });
            
            // Tampilkan halaman yang dituju
            const halamanTujuan = document.getElementById(idHalaman);
            halamanTujuan.classList.add('active');

            // Reset animasi agar berjalan kembali setiap halamannya dibuka
            const animatedItems = halamanTujuan.querySelectorAll('.animate-item');
            animatedItems.forEach(item => {
                item.style.animation = 'none';
                item.offsetHeight; /* Trigger reflow */
                item.style.animation = null; 
            });
            window.scrollTo(0, 0);
        }

        // Fungsi khusus untuk menampilkan data profil dinamis
        function lihatProfil(nama, jabatan, bio, ikon) {
            // Isi data ke dalam HTML profil
            document.getElementById('profil-nama').innerText = nama;
            document.getElementById('profil-jabatan').innerText = jabatan;
            document.getElementById('profil-bio').innerText = bio;
            document.getElementById('profil-ikon').className = 'fa-solid ' + ikon + ' fs-1';
            
            // Arahkan ke halaman profil
            navigasiKe('page-profile');
        }
    </script>
</body>
</html>
