<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KKN-M UNY 2026 | Sejati Dukuh</title>
    
    <!-- Load Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Load FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Load Google Font: Plus Jakarta Sans (Sangat cocok untuk UI modern/guideline) -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           COLOR PALETTE DARI DESIGN GUIDELINE 2026
           ========================================= */
        :root {
            --yellow-earth: #F0C52B;
            --cloud-white: #FAFAFA;
            --nano-black: #141414;
            --cafe-noir: #4C3D19;
            --kombu-green: #374026;
            --tan: #CFBB9B;
            --bone: #E6D8C3;
        }

        body {
            background-color: var(--kombu-green);
            color: var(--cloud-white);
            font-family: 'Plus Jakarta Sans', Tahoma, Geneva, sans-serif;
            overflow-x: hidden;
            background-image: radial-gradient(circle at top right, #4a5535 0%, var(--kombu-green) 70%);
            min-height: 100vh;
        }

        /* Container utama agar seperti tampilan HP di Desktop */
        .app-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 40px 15px;
            position: relative;
        }

        /* --- Animasi --- */
        @keyframes fadeInSlideUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(240, 197, 43, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(240, 197, 43, 0); }
            100% { box-shadow: 0 0 0 0 rgba(240, 197, 43, 0); }
        }

        .animate-up { animation: fadeInSlideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }

        /* --- Tampilan Halaman (View) --- */
        .view-section {
            display: none; 
            animation: fadeIn 0.4s ease forwards;
        }
        .view-section.active {
            display: block; 
        }

        /* --- Gaya Elemen Halaman Utama --- */
        .profile-img-main {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid var(--yellow-earth);
            animation: fadeInSlideUp 0.8s ease forwards, pulseGlow 3s infinite;
            background-color: var(--cloud-white);
        }

        .link-btn {
            background-color: var(--bone);
            color: var(--nano-black);
            border: 2px solid var(--tan);
            border-radius: 50px;
            position: relative;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-weight: 700;
        }

        .link-btn:hover {
            background-color: var(--yellow-earth);
            color: var(--nano-black);
            transform: translateY(-5px) scale(1.02);
            border-color: var(--yellow-earth);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.25), 0 0 15px rgba(240, 197, 43, 0.3);
        }

        .link-btn:active {
            transform: scale(0.95);
        }

        .icon-wrapper {
            font-size: 1.3rem;
            transition: transform 0.4s ease;
        }
        
        .link-btn:hover .icon-wrapper {
            transform: rotate(-10deg) scale(1.15);
            color: var(--cafe-noir) !important;
        }

        /* Tombol Spesial (Anggota) */
        .btn-special {
            background-color: var(--yellow-earth);
            border-color: var(--yellow-earth);
            color: var(--nano-black) !important;
        }
        .btn-special:hover {
            background-color: var(--cloud-white);
            border-color: var(--cloud-white);
        }

        /* --- Gaya Elemen Halaman Tim --- */
        .top-nav {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            gap: 15px;
        }
        
        .btn-back {
            background-color: var(--cafe-noir);
            color: var(--yellow-earth);
            border: 2px solid var(--tan);
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .btn-back:hover { 
            background-color: var(--yellow-earth); 
            color: var(--nano-black); 
            transform: translateX(-5px);
        }

        .team-card {
            background-color: var(--cafe-noir);
            border: 2px solid var(--tan);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            height: 100%;
        }
        .team-card:hover {
            border-color: var(--yellow-earth);
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0,0,0,0.2);
            background-color: #5a4920; /* Lebih terang sedikit saat di-hover */
        }
        .team-card img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
            border: 2px solid var(--bone);
        }
        .role-badge {
            font-size: 0.75rem;
            background-color: var(--yellow-earth);
            color: var(--nano-black);
            padding: 4px 10px;
            border-radius: 15px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        /* --- Gaya Elemen Detail Anggota --- */
        .member-detail-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--yellow-earth);
            margin-bottom: 20px;
            background-color: var(--cloud-white);
        }
        .bio-box {
            background-color: rgba(76, 61, 25, 0.7); /* Cafe Noir transparan */
            border: 1px dashed var(--tan);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            text-align: justify;
            font-size: 0.95rem;
            color: var(--cloud-white);
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- ============================== -->
        <!-- 1. HALAMAN UTAMA (LINK IN BIO) -->
        <!-- ============================== -->
        <div id="view-home" class="view-section active text-center">
            <img src="logo-kkn.png" alt="Logo KKN" class="profile-img-main mb-3 animate-up" onerror="this.src='https://placehold.co/120x120/F0C52B/141414?text=KKN'">
            
            <div class="animate-up delay-1">
                <h2 class="fw-bold mb-1" style="color: var(--yellow-earth); letter-spacing: -0.5px;">KKN-M UNY 2026</h2>
                <p class="mb-4" style="color: var(--tan); font-weight: 600;">Sejati Dukuh, Moyudan</p>
            </div>

            <div class="d-flex flex-column gap-3 animate-up delay-2">
                <!-- Tombol Navigasi ke Halaman Anggota -->
                <button onclick="switchView('view-team')" class="btn link-btn btn-special py-3">
                    <i class="fa-solid fa-users icon-wrapper text-dark"></i>
                    Kenali Anggota Kami
                </button>

                <a href="https://instagram.com/..." target="_blank" class="btn link-btn py-3">
                    <i class="fa-brands fa-instagram icon-wrapper" style="color: #E1306C;"></i> Instagram KKN
                </a>
                
                <a href="https://wa.me/..." target="_blank" class="btn link-btn py-3">
                    <i class="fa-brands fa-whatsapp icon-wrapper" style="color: #25D366;"></i> Hubungi Kami (WA)
                </a>

                <a href="https://maps.google.com/..." target="_blank" class="btn link-btn py-3">
                    <i class="fa-solid fa-map-location-dot icon-wrapper text-primary"></i> Lokasi Posko
                </a>
            </div>
            
            <div class="animate-up delay-3 mt-5">
                <small style="color: var(--tan); font-weight: 500;">© 2026 KKN Mandiri UNY</small>
            </div>
        </div>


        <!-- ============================== -->
        <!-- 2. HALAMAN DAFTAR ANGGOTA      -->
        <!-- ============================== -->
        <div id="view-team" class="view-section">
            <div class="top-nav animate-up">
                <button onclick="switchView('view-home')" class="btn-back"><i class="fa-solid fa-arrow-left"></i></button>
                <h4 class="mb-0 fw-bold" style="color: var(--yellow-earth);">Struktur Tim KKN</h4>
            </div>

            <!-- Grid Anggota akan digenerate oleh JavaScript di sini -->
            <div class="row g-3" id="team-grid"></div>
        </div>


        <!-- ============================== -->
        <!-- 3. HALAMAN DETAIL PROFIL       -->
        <!-- ============================== -->
        <div id="view-member" class="view-section">
            <div class="top-nav animate-up">
                <button onclick="switchView('view-team')" class="btn-back"><i class="fa-solid fa-arrow-left"></i></button>
                <h4 class="mb-0 fw-bold" style="color: var(--cloud-white);">Profil Anggota</h4>
            </div>

            <div class="text-center mt-4 animate-up delay-1">
                <img src="" id="detail-img" class="member-detail-img shadow-lg" alt="Foto Anggota" onerror="this.src='https://placehold.co/150x150/CFBB9B/141414?text=Foto'">
                <h2 id="detail-name" class="fw-bold mb-1" style="color: var(--yellow-earth);">Nama Anggota</h2>
                <div class="mb-3"><span id="detail-role" class="role-badge">Jabatan</span></div>
                <p id="detail-major" class="mb-4" style="color: var(--tan); font-weight: 600;"><i class="fa-solid fa-graduation-cap"></i> Jurusan / Fakultas</p>
                
                <!-- Sosial Media Individu -->
                <div class="d-flex justify-content-center gap-3 mb-4">
                    <a href="#" id="detail-ig" class="btn-back text-decoration-none" target="_blank"><i class="fa-brands fa-instagram"></i></a>
                    <a href="#" id="detail-linkedin" class="btn-back text-decoration-none" target="_blank"><i class="fa-brands fa-linkedin-in"></i></a>
                </div>

                <div class="bio-box text-start">
                    <h6 class="fw-bold mb-2" style="color: var(--yellow-earth);"><i class="fa-solid fa-quote-left me-2"></i>Tentang Saya</h6>
                    <p id="detail-bio" class="mb-0">Deskripsi singkat atau motto hidup anggota KKN akan muncul di sini.</p>
                </div>
            </div>
        </div>

    </div>

    <!-- ============================== -->
    <!-- LOGIC JAVASCRIPT               -->
    <!-- ============================== -->
    <script>
        // Data Anggota KKN (TIDAK ADA YANG DIUBAH DI BAGIAN INI)
        const teamData = [
            {
                id: "ketua",
                name: "Arya Bima",
                role: "Ketua KKN",
                major: "Manajemen - FEB",
                bio: "Bertanggung jawab atas koordinasi seluruh program kerja KKN di Sejati Dukuh. Bersemangat dalam pengembangan potensi UMKM desa.",
                photo: "https://placehold.co/300x300/4C3D19/F0C52B?text=Ketua",
                ig: "https://instagram.com/arya",
                linkedin: "https://linkedin.com/in/arya"
            },
            {
                id: "wakil",
                name: "Siti Nurhaliza",
                role: "Wakil Ketua",
                major: "Pendidikan Sosiologi - FISIPOL",
                bio: "Membantu ketua dalam mengawasi jalannya proker serta menjalin komunikasi yang baik dengan tokoh masyarakat setempat.",
                photo: "https://placehold.co/300x300/4C3D19/F0C52B?text=Wakil",
                ig: "https://instagram.com/siti",
                linkedin: "https://linkedin.com/in/siti"
            },
            {
                id: "sekretaris",
                name: "Dina Mariana",
                role: "Sekretaris",
                major: "Sastra Indonesia - FBS",
                bio: "Mengurus segala administrasi, persuratan, dan penyusunan laporan akhir KKN. Pecinta kucing dan penikmat senja.",
                photo: "https://placehold.co/300x300/4C3D19/F0C52B?text=Sekre",
                ig: "https://instagram.com/dina",
                linkedin: "https://linkedin.com/in/dina"
            },
            {
                id: "bendahara",
                name: "Reza Rahadian",
                role: "Bendahara",
                major: "Akuntansi - FEB",
                bio: "Mengatur sirkulasi keuangan kelompok. Transparan, teliti, dan disiplin dalam mencatat setiap pengeluaran proker.",
                photo: "https://placehold.co/300x300/4C3D19/F0C52B?text=Benda",
                ig: "https://instagram.com/reza",
                linkedin: "https://linkedin.com/in/reza"
            },
            {
                id: "pdd",
                name: "Bagas Kara",
                role: "Koor. PDD",
                major: "Ilmu Komunikasi - FISIPOL",
                bio: "Orang di balik layar akun media sosial KKN Sejati Dukuh. Suka mendokumentasikan senyum warga dan keseruan proker.",
                photo: "https://placehold.co/300x300/4C3D19/F0C52B?text=PDD",
                ig: "https://instagram.com/bagas",
                linkedin: "https://linkedin.com/in/bagas"
            }
        ];

        // Fungsi untuk merender daftar anggota ke HTML
        function renderTeamGrid() {
            const grid = document.getElementById("team-grid");
            let htmlContent = "";

            // Menambahkan class delay untuk animasi stagger
            teamData.forEach((member, index) => {
                const delayClass = `delay-${(index % 3) + 1}`;
                htmlContent += `
                <div class="col-6">
                    <div class="team-card animate-up ${delayClass}" onclick="showMemberProfile('${member.id}')">
                        <img src="${member.photo}" alt="${member.name}" onerror="this.src='https://placehold.co/80x80/CFBB9B/141414?text=Foto'">
                        <h6 class="fw-bold mb-1 text-white" style="font-size: 0.9rem;">${member.name}</h6>
                        <span class="role-badge mt-1 d-inline-block">${member.role}</span>
                    </div>
                </div>
                `;
            });

            grid.innerHTML = htmlContent;
        }

        // Fungsi untuk pindah antar halaman (view)
        function switchView(targetViewId) {
            // Sembunyikan semua view
            document.querySelectorAll('.view-section').forEach(section => {
                section.classList.remove('active');
            });
            
            // Tampilkan view yang dituju
            const targetView = document.getElementById(targetViewId);
            targetView.classList.add('active');

            // Mereset animasi agar berjalan lagi saat halaman dibuka
            const animatedItems = targetView.querySelectorAll('.animate-up');
            animatedItems.forEach(item => {
                item.style.animation = 'none';
                item.offsetHeight; // Trigger reflow
                item.style.animation = null; 
            });

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Fungsi untuk menampilkan profil detail anggota
        function showMemberProfile(memberId) {
            // Cari data anggota berdasarkan ID
            const member = teamData.find(m => m.id === memberId);
            
            if(member) {
                // Isi data ke dalam HTML
                document.getElementById('detail-img').src = member.photo;
                document.getElementById('detail-name').innerText = member.name;
                document.getElementById('detail-role').innerText = member.role;
                document.getElementById('detail-major').innerHTML = `<i class="fa-solid fa-graduation-cap"></i> ${member.major}`;
                document.getElementById('detail-bio').innerText = member.bio;
                
                document.getElementById('detail-ig').href = member.ig;
                document.getElementById('detail-linkedin').href = member.linkedin;

                // Pindah ke halaman profil
                switchView('view-member');
            }
        }

        // Inisialisasi saat halaman pertama kali dimuat
        window.onload = () => {
            renderTeamGrid();
        };

    </script>
</body>
</html>
